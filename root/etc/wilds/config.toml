# WILDS configuration, read by wilds-control (re-read when the file changes).
# The passphrases are not here: they are in /etc/wilds/passphrases.toml.

# "production" on a deployed machine. The default, "development", also enables the /dev
# helpers (a made-up test job), which have no place on the instrument.
opmode = "production"

[presence]
# Seconds without contact before the Telescope Operator counts as offline.
to_timeout_s = 75

[site]
# "LDT local time" shown in the GUI header. Arizona has no daylight saving, so UTC-7 all year.
timezone = "America/Phoenix"
